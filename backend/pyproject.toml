[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ucgle_f1"
version = "0.1.0"
description = "UCGLE-F1: sGB-CS gravitational leptogenesis simulator with co-located agent orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "UCGLE-F1 authors" }]

# ── Core numerical / physics stack ─────────────────────────────────────
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "sympy>=1.13",
  "astropy>=6.0",
  "mpmath>=1.3",
  "numba>=0.60",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "sqlmodel>=0.0.22",
  "typing-extensions>=4.12",
  "orjson>=3.10",
  "anyio>=4.4",
  "sse-starlette>=2.1",
  "tenacity>=9.0",
  # Supabase JWT verification via JWKS (P3-04 / correction 9). MIT.
  "pyjwt[crypto]>=2.9",
  "pyyaml>=6.0",
  # Postgres for every backend store (P3-01). LGPL-3.0 (weak copyleft, R11).
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# Fast paths (JAX + diffrax + equinox) — optional because JAX is heavy.
jax = [
  "jax>=0.4.30",
  "jaxlib>=0.4.30",
  "diffrax>=0.6",
  "equinox>=0.11",
]
# Big-integer / exact arithmetic paths.
highprec = [
  "gmpy2>=2.2",
  "python-flint>=0.6",
]
# Multi-field scalar backend adapter.
# PyTransport 3.0 (github.com/Zer095/PyTransport3.0) is not published to
# any package index, so it cannot be a resolvable extra; install it by
# hand — see docs/qcompass/optional-backends.md. The extra stays (empty)
# so `pip install ucgle_f1[multifield]` keeps working.
multifield = []
# ULYSSES Boltzmann backend.
boltzmann = [
  "ulysses",  # github.com/earlyuniverse/ulysses
]
# Cosmology / GW output stack.
cosmo = [
  "camb>=1.5",
  "classy",
]
gw = [
  "CosmoGW",   # github.com/CosmoGW/CosmoGW
  "PTAfast",   # github.com/reggiebernardo/PTAfast
  # GWBird (github.com/ilariacaporali/GWBird) is not on any package
  # index — manual install, see docs/qcompass/optional-backends.md.
]
# Inference backends.
infer = [
  "cobaya>=3.5",
  "bilby>=2.3",
  "dynesty>=2.1",
]
# Parallel / distributed.
mpi = [
  "mpi4py>=3.1",
]
# Agent model providers (all optional — selection via config).
openai    = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
ollama    = ["ollama>=0.3"]
llamacpp  = ["llama-cpp-python>=0.3"]
vllm      = ["vllm>=0.6"]
# Sandbox.
sandbox   = ["docker>=7.1"]
# qcompass adapter — enables the cosmology.ucglef1 plugin to drive
# the M1-M7 pipeline through qcompass_core.Simulation.
qcompass  = ["qcompass-core>=0.1,<0.2"]
# Visualization streaming + bake (cosmic_forge_viz, sibling package
# under backend/src/). Extras stay opt-in so the agent stack can be
# installed without WS / Zarr / msgpack pulled in.
viz = [
  "fastapi>=0.136",
  "uvicorn[standard]>=0.41",
  "hypercorn>=0.17",
  "ormsgpack>=1.7",
  "zarr>=3.0",
  "pydantic-zarr>=0.7",
  "h5py>=3.12",
  "httpx>=0.28",
  "websockets>=14",
  "typer>=0.12",
]
# Dev.
dev = [
  "dirhash>=0.5",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  # starlette>=1.10 TestClient requires httpx2 (httpx path is deprecated).
  "httpx2>=2.16",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "jupyter-book>=1.0",
  "myst-nb>=1.1",
]

# Default dev group for this package (PEP 735). `uv sync --package ucgle_f1`
# and `uv run` inside backend/ install it, so the drift alarm's
# `uv run pytest audit` finds pytest (Gate 0). Mirrors the test part of the
# `dev` extra above.
[dependency-groups]
dev = [
  # The audits exercise the M8 qcompass routes and cosmic_forge_viz (A7):
  # the `qcompass` and `viz` extras' packages plus the chemistry plugin
  # A7 lists. (A self-reference `ucgle-f1[...]` trips the declared
  # ucgle-f1 / qcompass-router[braket] lock conflict.)
  "qcompass-core>=0.1,<0.2",
  "qfull-chemistry",
  "fastapi>=0.136",
  "uvicorn[standard]>=0.41",
  "hypercorn>=0.17",
  "ormsgpack>=1.7",
  "zarr>=3.0",
  "pydantic-zarr>=0.7",
  "h5py>=3.12",
  "httpx>=0.28",
  "websockets>=14",
  "typer>=0.12",
  "dirhash>=0.5",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx2>=2.16",
  "hypothesis>=6",
  "openapi-spec-validator>=0.9",
]

[project.scripts]
ucgle-f1 = "ucgle_f1.cli:main"
ucgle-f1-agent = "ucgle_f1.m8_agent.server:run"
cosmic-forge-viz = "cosmic_forge_viz.cli:main"

# qcompass plugin: discovered by qcompass_core.registry when
# qcompass-core is installed and ucgle_f1 has been pip-installed.
[project.entry-points."qcompass.domains"]
"cosmology.ucglef1" = "ucgle_f1.adapters.qcompass:LeptogenesisSimulation"

[tool.hatch.build.targets.wheel]
packages = ["src/ucgle_f1", "src/cosmic_forge_viz"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "audit"]

[tool.ruff.lint]
select = [
  "E", "F", "I", "N", "UP", "B", "SIM", "RUF", "PL", "TID", "PTH", "ASYNC",
]
ignore = ["PLR0913", "PLR2004", "PLR0915"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Permissive on optional heavy deps we only call through thin adapters.
[[tool.mypy.overrides]]
module = [
  "jax.*", "jaxlib.*", "diffrax.*", "equinox.*",
  "ulysses.*", "camb.*", "classy.*",
  "CosmoGW.*", "PTAfast.*", "GWBird.*", "PyTransport.*",
  "cobaya.*", "bilby.*", "dynesty.*",
  "ollama.*", "llama_cpp.*", "vllm.*",
  "docker.*", "numba.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "audit"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:jax.*",
  "ignore::DeprecationWarning:ulysses.*",
]
markers = [
  "slow: long-running physics integration test",
  "s_audit: S1–S15 physics audit check",
  "a_audit: A1–A6 agent audit check",
  "needs_jax: requires JAX",
  "needs_ulysses: requires ULYSSES",
  "needs_docker: requires Docker sandbox",
]
