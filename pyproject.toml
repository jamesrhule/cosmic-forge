# QCompass workspace root.
#
# This file is the *workspace* manifest. It does NOT publish a package
# of its own. Each member directory under `members` carries its own
# pyproject.toml. The reference UCGLE-F1 implementation lives in
# `backend/` and is semver-pinned at 1.0.0; do not modify its
# pyproject.toml.

[project]
name = "qcompass-workspace"
version = "0.1.0"
description = "QCompass — multi-package research monorepo (UCGLE-F1 reference + qfull-* extensions)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# No runtime dependencies at the workspace level. Member packages
# declare their own.
dependencies = []

[tool.uv]
package = false
managed = true
# amazon-braket-sdk>=1.115 pins antlr4-python3-runtime==4.13.2 while
# omegaconf (ucgle_f1 config loading) pins antlr4-python3-runtime==4.9.*,
# so the Braket extra cannot share an environment with the cosmology
# backend. Declared here so the lock resolves both forks.
conflicts = [
  [{ package = "ucgle-f1" }, { package = "qcompass-router", extra = "braket" }],
  # The worker depends on ucgle-f1, so it inherits the same conflict
  # (correction 3: P2-01 builds the qpu worker image without Hydra).
  [{ package = "qcompass-worker" }, { package = "qcompass-router", extra = "braket" }],
]

[tool.uv.sources]
# Every workspace member resolves from the workspace, never from PyPI.
ucgle-f1 = { workspace = true }
qcompass = { workspace = true }
qcompass-core = { workspace = true }
qcompass-router = { workspace = true }
qcompass-bench = { workspace = true }
qfull-amo = { workspace = true }
qfull-chemistry = { workspace = true }
qfull-condmat = { workspace = true }
qfull-gravity = { workspace = true }
qfull-hep = { workspace = true }
qfull-nuclear = { workspace = true }
qfull-statmech = { workspace = true }
qcompass-worker = { workspace = true }

[tool.uv.workspace]
members = ["backend", "packages/*", "workers"]
# packages/ts/* is the pnpm domain; uv must not try to resolve it as a
# Python member. packages/__pycache__ is written by packages/conftest.py's
# import and matches `packages/*` (Gate 1 nit).
exclude = [".lovable", "supabase", "e2e", "packages/ts", "packages/__pycache__"]

# Dev tooling for every workspace member (PEP 735 dependency group;
# replaces the deprecated `[tool.uv] dev-dependencies`).
[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-regressions>=2.5",
  "syrupy>=4.7",
  "dirhash>=0.5",
  # starlette>=1.10 TestClient requires httpx2 (httpx path is deprecated).
  "httpx2>=2.16",
  # P3-06 OpenAPI lint (Apache-2.0).
  "openapi-spec-validator>=0.9",
  "hypothesis>=6.120",
  "pre-commit>=4.0",
  "bandit>=1.7",
]

# Workspace-wide tool config. Each member can override.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".lovable", "supabase", "e2e", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "PL", "TID", "PTH", "ASYNC"]
ignore = ["PLR0913", "PLR2004", "PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
exclude = "(\\.lovable|supabase|e2e|node_modules)/"

[tool.pytest.ini_options]
# Workspace-default pytest config. Member packages override via their
# own pyproject. The drift alarm runs `pytest backend/audit -q -m
# "not slow"` directly, ignoring this section.
testpaths = ["backend/tests", "backend/audit", "packages"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# `importlib` import mode lets us run `pytest packages` from the repo
# root without `tests/test_manifest.py` files in different packages
# colliding under pytest's default `prepend` strategy. Each member
# package's own pyproject also sets this so single-package runs
# behave identically.
addopts = "--import-mode=importlib"
markers = [
  "slow: long-running test",
  "s_audit: S1–S15 physics audit",
  "a_audit: A1–A6 agent audit",
  "needs_jax: requires JAX",
  "needs_pyscf: requires PySCF",
  "needs_ulysses: requires ULYSSES",
  "needs_docker: requires Docker sandbox",
]
