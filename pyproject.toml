# QCompass workspace root.
#
# This file is the *workspace* manifest. It does NOT publish a package
# of its own. Each member directory under `members` carries its own
# pyproject.toml. The reference UCGLE-F1 implementation lives in
# `backend/` and is semver-pinned at 1.0.0; do not modify its
# pyproject.toml.

[project]
name = "qcompass-workspace"
version = "0.1.0"
description = "QCompass — multi-package research monorepo (UCGLE-F1 reference + qfull-* extensions)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# No runtime dependencies at the workspace level. Member packages
# declare their own.
dependencies = []

[tool.uv]
package = false
managed = true
# amazon-braket-sdk>=1.115 pins antlr4-python3-runtime==4.13.2 while
# omegaconf (ucgle_f1 config loading) pins antlr4-python3-runtime==4.9.*,
# so the Braket extra cannot share an environment with the cosmology
# backend. Declared here so the lock resolves both forks.
#
# Every other extra that pulls amazon-braket-sdk (directly, or through
# bloqade-analog) conflicts with ucgle-f1 for the same reason: the first
# Braket SDK without GHSA-g697-2xrc-gc46 (1.117.0) needs
# amazon-braket-default-simulator>=1.32.0, which pins antlr4 4.13.2, and
# hydra-core 1.3.8 (the latest stable) still pins 4.9.*. Without these
# declarations the lock satisfied them next to ucgle-f1 with the vulnerable
# amazon-braket-sdk 1.88.1. Braket environments run without the cosmology
# backend (plan-author correction 3: P2-01's separate CI job, lock fork and
# qpu worker image).
conflicts = [
  [{ package = "ucgle-f1" }, { package = "qcompass-router", extra = "braket" }],
  [{ package = "ucgle-f1" }, { package = "qcompass-router", extra = "quera" }],
  [{ package = "ucgle-f1" }, { package = "qfull-hep", extra = "ionq" }],
  [{ package = "ucgle-f1" }, { package = "qfull-nuclear", extra = "ionq" }],
  [{ package = "ucgle-f1" }, { package = "qfull-amo", extra = "bloqade-analog" }],
  [{ package = "ucgle-f1" }, { package = "qfull-amo", extra = "bloqade-digital" }],
  [{ package = "ucgle-f1" }, { package = "qfull-condmat", extra = "analog" }],
  # The worker depends on ucgle-f1, so it inherits every ucgle-f1 conflict
  # (correction 3: P2-01 builds the qpu worker image without Hydra).
  [{ package = "qcompass-worker" }, { package = "qcompass-router", extra = "braket" }],
  [{ package = "qcompass-worker" }, { package = "qcompass-router", extra = "quera" }],
  [{ package = "qcompass-worker" }, { package = "qfull-hep", extra = "ionq" }],
  [{ package = "qcompass-worker" }, { package = "qfull-nuclear", extra = "ionq" }],
  [{ package = "qcompass-worker" }, { package = "qfull-amo", extra = "bloqade-analog" }],
  [{ package = "qcompass-worker" }, { package = "qfull-amo", extra = "bloqade-digital" }],
  [{ package = "qcompass-worker" }, { package = "qfull-condmat", extra = "analog" }],
]
# Security floors for transitive dependencies no member declares directly.
# Each is the first release that fixes every high/critical advisory the
# dependency review found in the locked version (P0-05, docs/build/evidence/
# P0-05-dependency-review.md). They constrain the lock only; they add no
# dependency.
constraint-dependencies = [
  # GHSA-g697-2xrc-gc46 (first patched 1.117.0). Members that name it
  # directly carry the same floor; this one also covers bloqade-analog.
  "amazon-braket-sdk>=1.117.0",
  # GHSA-r6ph-v2qm-q3c2, GHSA-537c-gmf6-5ccf, GHSA-jwv3-5hgf-82ww,
  # GHSA-g6cj-pr64-35w5 (first patched 50.0.0). Via azure-quantum,
  # qiskit-ibm-runtime (requests-ntlm), pulser (pyjwt) and bloqade (jwskate).
  "cryptography>=50.0.0",
  # GHSA-vxj4-q4g9-crj7, GHSA-c978-59m8-c77v, GHSA-6w3r-xr62-4xcp,
  # GHSA-394h-qwmc-48pf (first patched 21.14.9). Not in the lock today
  # (pre-commit runs as a uv tool, see [dependency-groups].dev); the floor
  # keeps a vulnerable virtualenv out if anything brings it back.
  "virtualenv>=21.14.9",
  # GHSA-h35f-9h28-mq5c (moderate, 83.0.0), GHSA-xmj3-9gf7-h52w (low,
  # 84.1.0). Via pyscf.
  "setuptools>=84.1.0",
]

[tool.uv.sources]
# Every workspace member resolves from the workspace, never from PyPI.
ucgle-f1 = { workspace = true }
qcompass = { workspace = true }
qcompass-core = { workspace = true }
qcompass-router = { workspace = true }
qcompass-bench = { workspace = true }
qfull-amo = { workspace = true }
qfull-chemistry = { workspace = true }
qfull-condmat = { workspace = true }
qfull-gravity = { workspace = true }
qfull-hep = { workspace = true }
qfull-nuclear = { workspace = true }
qfull-statmech = { workspace = true }
qcompass-worker = { workspace = true }

[tool.uv.workspace]
# Members are listed one by one, never by glob: any other directory under
# packages/ (packages/ts, the __pycache__ that packages/conftest.py's import
# writes, a stray node_modules) would match `packages/*` and break every uv
# command for lack of a pyproject.toml (Gate 1 nit). A new member is added
# here and to [tool.uv.sources]; backend/tests/test_workspace_members.py
# fails until it is.
members = [
  "backend",
  "packages/qcompass",
  "packages/qcompass-bench",
  "packages/qcompass-core",
  "packages/qcompass-router",
  "packages/qfull-amo",
  "packages/qfull-chemistry",
  "packages/qfull-condmat",
  "packages/qfull-gravity",
  "packages/qfull-hep",
  "packages/qfull-nuclear",
  "packages/qfull-statmech",
  "workers",
]
exclude = [".lovable", "supabase", "e2e", "packages/ts"]

# Dev tooling for every workspace member (PEP 735 dependency group;
# replaces the deprecated `[tool.uv] dev-dependencies`).
[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-regressions>=2.5",
  "syrupy>=4.7",
  "dirhash>=0.5",
  # starlette>=1.10 TestClient requires httpx2 (httpx path is deprecated).
  "httpx2>=2.16",
  # P3-06 OpenAPI lint (Apache-2.0).
  "openapi-spec-validator>=0.9",
  "hypothesis>=6.120",
  # pre-commit is not a project dependency: it runs as its own uv tool
  # (`uvx pre-commit install`, `uvx pre-commit run --all-files`). In the
  # project lock it dragged in virtualenv, whose patched releases
  # (>=21.14.9) need packaging>=26.3 while every current iqm-client caps
  # packaging<25, which would downgrade qcompass-router[iqm] to iqm-client 20.
  "bandit>=1.7",
]

# Workspace-wide tool config. Each member can override.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".lovable", "supabase", "e2e", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "PL", "TID", "PTH", "ASYNC"]
ignore = ["PLR0913", "PLR2004", "PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
exclude = "(\\.lovable|supabase|e2e|node_modules)/"

[tool.pytest.ini_options]
# Workspace-default pytest config. Member packages override via their
# own pyproject. The drift alarm runs `pytest backend/audit -q -m
# "not slow"` directly, ignoring this section.
testpaths = ["backend/tests", "backend/audit", "packages"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# `importlib` import mode lets us run `pytest packages` from the repo
# root without `tests/test_manifest.py` files in different packages
# colliding under pytest's default `prepend` strategy. Each member
# package's own pyproject also sets this so single-package runs
# behave identically.
addopts = "--import-mode=importlib"
markers = [
  "slow: long-running test",
  "s_audit: S1–S15 physics audit",
  "a_audit: A1–A6 agent audit",
  "needs_jax: requires JAX",
  "needs_pyscf: requires PySCF",
  "needs_ulysses: requires ULYSSES",
  "needs_docker: requires Docker sandbox",
]
