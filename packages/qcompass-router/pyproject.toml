# qcompass-router: cost-aware backend router for the QCompass workspace.
#
# PROMPT 6A scope: provider-adapter layer + routing skeleton + stub
# pricing seed. PROMPT 6B layers on live pricing fetchers, the
# calibration drift cache, transform stack, and the full
# A-router-1..6 audit.
#
# Boundary: this package MUST NOT import from `ucgle_f1` or any
# `qfull_*` sibling. CI enforces with both the parametric grep step
# in .github/workflows/ci.yml and tests/test_boundary.py.

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "qcompass-router"
version = "0.2.0"
description = "QCompass router: cost-aware backend selection with soft-imported provider adapters."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "QCompass authors" }]
dependencies = [
  "qcompass-core>=0.1,<0.2",
  "pydantic>=2.12",
  "pyyaml>=6",
  # PROMPT 6 v2 §"DEPS (add)" pins. httpx is the SSL-pinned client
  # used by ssl_pin + the v2 PricingEngine; sqlite-utils is held as
  # an optional helper for the calibration cache (sqlite3 stdlib
  # remains the on-disk path so nothing breaks at import time when
  # sqlite-utils isn't present).
  "httpx>=0.28",
  "sqlite-utils>=3.36",
]

[project.optional-dependencies]
# Security floors carried into the published wheel (the workspace lock gets
# them from root [tool.uv] constraint-dependencies, which wheels never see):
# - cryptography>=50.0.0 (GHSA-r6ph-v2qm-q3c2, GHSA-537c-gmf6-5ccf,
#   GHSA-jwv3-5hgf-82ww, GHSA-g6cj-pr64-35w5; high), pulled by
#   qiskit-ibm-runtime, azure-quantum and pulser. azure-quantum 3.13.0 caps
#   cryptography<=46.0.3, so with the floor a resolver picks 3.12.0 or a
#   later release without the cap.
# - amazon-braket-sdk>=1.117.0 (GHSA-g697-2xrc-gc46; high), pulled directly
#   and through bloqade-analog.
ibm = [
  "qiskit>=2.2,<3",
  "qiskit-aer>=0.17",
  "qiskit-ibm-runtime",
  "cryptography>=50.0.0",
]
braket = ["amazon-braket-sdk>=1.117.0"]
azure = ["azure-quantum>=2", "cryptography>=50.0.0"]
ionq = []  # native IonQ via qiskit-ionq when needed
iqm = ["iqm-client"]
quera = ["bloqade-analog>=0.15", "amazon-braket-sdk>=1.117.0"]
pasqal = ["pulser>=1.0", "cryptography>=50.0.0"]
lightning = ["pennylane>=0.44", "pennylane-lightning>=0.44"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "vcrpy>=6",
  "mypy>=1.13",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qcompass_router"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "qiskit.*", "qiskit_aer.*", "qiskit_ibm_runtime.*",
  "braket.*", "azure.quantum.*", "iqm_client.*", "qiskit_iqm.*",
  "bloqade.*", "bloqade_analog.*", "pulser.*",
  "pennylane.*", "pennylane_lightning.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "src/qcompass_router/audit"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "slow: long-running test",
  "s_audit: per-router A-router-* audit",
  "needs_qiskit: requires qiskit",
  "needs_braket: requires amazon-braket-sdk",
  "needs_pennylane: requires pennylane",
  "needs_certifi: requires certifi (ssl_pin)",
]
