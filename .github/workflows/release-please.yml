name: release-please

# PROMPT 10 v2 §E. Drives the QCompass release train:
#   - PyPI publishes via OIDC trusted publisher.
#   - Docker images push to ghcr.io/jamesrhule/qcompass-runtime:{cpu,cuda12}.
#   - mkdocs site rebuilds on every tagged release.
#
# release-please opens / maintains a Release PR per workspace
# member; merging that PR cuts the tag and triggers the publish
# jobs.
#
# Gate 1 (c6): the workflow grants nothing by default; each job gets only
# the permissions it uses. Every action is pinned to a commit SHA (the tag
# it was resolved from is in the comment), and the docs tools install from
# the hash-locked docs/requirements.txt. PyPI trusted publishing and the
# GitHub environment `pypi` are James's to configure (PLAN Part 6).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    name: open-release-pr
    runs-on: ubuntu-22.04
    permissions:
      contents: write # tags, releases, the release branch
      pull-requests: write # the Release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      # The meta-package's release tag (qcompass-vX.Y.Z) triggers production.
      qcompass_tag: ${{ steps.rp.outputs['packages/qcompass--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: rp
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  publish-pypi:
    name: pypi-publish
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build wheels for every workspace member
        run: |
          set -euo pipefail
          mkdir -p dist
          for pkg in packages/qcompass-core packages/qcompass-router \
                    packages/qcompass-bench packages/qcompass \
                    packages/qfull-chemistry packages/qfull-condmat \
                    packages/qfull-amo packages/qfull-hep \
                    packages/qfull-nuclear packages/qfull-gravity \
                    packages/qfull-statmech; do
            uv build --package "$(basename "$pkg")" --out-dir dist || true
          done
          ls dist/

      - name: Publish to PyPI (trusted publisher / OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  publish-docker:
    name: docker-publish
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write # ghcr.io/jamesrhule/qcompass-runtime
    strategy:
      matrix:
        flavour: [cpu, cuda12]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push qcompass-runtime:${{ matrix.flavour }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.flavour }}
          push: true
          tags: |
            ghcr.io/jamesrhule/qcompass-runtime:${{ matrix.flavour }}
            ghcr.io/jamesrhule/qcompass-runtime:${{ matrix.flavour }}-${{ needs.release-please.outputs.tag_name }}

  publish-docs:
    name: mkdocs-publish
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write # mkdocs gh-deploy pushes the gh-pages branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Exact versions and hashes, wheels only: nothing outside the lock is
      # installed and no setup.py runs.
      - name: install the docs tools from the lock
        run: |
          python -m pip install --require-hashes --only-binary ':all:' -r docs/requirements.txt

      - run: mkdocs gh-deploy --force --clean

  # P3-07: production deploys on the qcompass release. Tags pushed with
  # GITHUB_TOKEN don't start deploy.yml's tag trigger, so it is called here.
  deploy-production:
    name: deploy production
    needs: release-please
    if: ${{ needs.release-please.outputs.qcompass_tag != '' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
