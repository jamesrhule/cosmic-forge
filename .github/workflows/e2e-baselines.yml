name: e2e baselines

# Regenerates the Playwright screenshot baselines on CI's own browser
# builds (chromium, firefox, webkit) and commits them to the chosen branch.
# Baselines must come from the same browsers that compare them; a
# sandbox-rendered PNG never matches CI pixel-for-pixel. Trigger it by
# pushing a commit whose message contains "[e2e-baselines]" to a build/**
# branch, then review every committed PNG (real content, no error page)
# before relying on it (PLAN.md P0-06 / R19). Never runs on main.

on:
  push:
    branches: ["build/**"]

permissions:
  contents: write

jobs:
  regenerate:
    if: contains(github.event.head_commit.message, '[e2e-baselines]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox webkit
      - name: regenerate screenshot baselines
        run: bunx playwright test e2e/cosmology-byte-identity.spec.ts --update-snapshots
      - name: commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "baselines unchanged"
            exit 0
          fi
          git commit -m "test(P0-06): regenerate e2e screenshot baselines on CI browsers"
          git push origin "HEAD:${{ github.ref_name }}"
